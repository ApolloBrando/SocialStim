name: Validate SocialStim

on:
  push:
    branches: [main, 'milestone/**', 'phase/**', 'fix/**']
  pull_request:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rules:
    name: Shared checks (NUnit ${{ matrix.nunit }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        nunit: ['3.5.0', '3.14.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate project structure
        run: python3 Tools/validate_scaffold.py
      - name: Test repository validation guards
        run: python3 -m unittest discover -s Tools -p 'test_*.py'
      - name: Compile against the older NUnit assertion API
        if: matrix.nunit == '3.5.0'
        run: dotnet build Tools/HeadlessTests/SocialStim.HeadlessTests.csproj --configuration Release -p:NUnitVersion=3.5.0
      - name: Compile and test shared rules and application code
        if: matrix.nunit == '3.14.0'
        run: dotnet test Tools/HeadlessTests/SocialStim.HeadlessTests.csproj --configuration Release -p:NUnitVersion=${{ matrix.nunit }} --logger trx --results-directory TestResults
      - name: Recheck source hygiene after build output exists
        if: always()
        run: python3 Tools/validate_scaffold.py
      - name: Preserve test results
        if: always() && matrix.nunit == '3.14.0'
        uses: actions/upload-artifact@v4
        with:
          name: headless-test-results-nunit-${{ matrix.nunit }}
          path: TestResults/*.trx
          if-no-files-found: warn
